[build-system]
requires = [ "setuptools>=83.0.0",]
build-backend = "setuptools.build_meta"

[project]
name = "nltget"
version = "1.1.61"
description = "Concurrent HTTP downloads and uploads for Python"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "download", "upload", "http", "range-requests",]
classifiers = [ "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only",]
dependencies = [ "nltfile>=1.0.35", "nltlog>=1.1.5", "requests>=2.34.2",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.license]
file = "LICENSE"

[project.scripts]
nltget = "nltget.script:nltget"

[project.urls]
Homepage = "https://github.com/farfarfun/nltget"
Repository = "https://github.com/farfarfun/nltget"
Issues = "https://github.com/farfarfun/nltget/issues"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [ "BLE001", "FA100",]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "SIM117",]
